<script>
    // Hash SHA-256 della password "docente2026"
    const TEACHER_PASSWORD_HASH = "e0e15db7ea2b7246473edffbe901763aa5391262d08a9c33cd5eb0ca20ad9eb2";
    
    let isTeacher = false;
    let categories = [];
    let wordEntries = [];

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initFirebaseListeners();
    });

    // Funzione SHA-256 corretta e compatibile
    async function hashPassword(str) {
      const msgUint8 = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function initFirebaseListeners() {
      const checkFB = setInterval(() => {
        if (window.db && window.fbMethods) {
          clearInterval(checkFB);
          const { collection, onSnapshot } = window.fbMethods;

          onSnapshot(collection(window.db, "categories"), (snapshot) => {
            categories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderApp();
          });

          onSnapshot(collection(window.db, "words"), (snapshot) => {
            wordEntries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            categories.forEach(c => renderCategoryWords(c.id));
          });
        }
      }, 100);
    }

    function toggleTeacherMode() {
      if (isTeacher) lockTeacherMode(); else openPasswordModal();
    }

    function openPasswordModal() {
      document.getElementById("passwordError").classList.add("hidden");
      document.getElementById("inputTeacherPassword").value = "";
      document.getElementById("passwordModal").classList.remove("hidden");
      document.getElementById("inputTeacherPassword").focus();
    }

    function closePasswordModal() {
      document.getElementById("passwordModal").classList.add("hidden");
    }

    // Gestione Password Corretta
    async function handlePasswordSubmit(e) {
      e.preventDefault();
      const pwd = document.getElementById("inputTeacherPassword").value.trim();
      const userHash = await hashPassword(pwd);

      if (userHash === TEACHER_PASSWORD_HASH) {
        isTeacher = true;
        closePasswordModal();
        updateTeacherUI();
      } else {
        document.getElementById("passwordError").classList.remove("hidden");
      }
    }

    function lockTeacherMode() {
      isTeacher = false;
      updateTeacherUI();
    }

    function updateTeacherUI() {
      const toolbar = document.getElementById("teacherToolbar");
      const icon = document.getElementById("teacherIcon");
      const text = document.getElementById("teacherStatusText");

      if (isTeacher) {
        toolbar.classList.remove("hidden");
        if (icon) {
          icon.setAttribute("data-lucide", "unlock");
          icon.className = "w-4 h-4 text-emerald-400";
        }
        if (text) text.textContent = "Docente Attivo";
      } else {
        toolbar.classList.add("hidden");
        if (icon) {
          icon.setAttribute("data-lucide", "lock");
          icon.className = "w-4 h-4 text-amber-400";
        }
        if (text) text.textContent = "Modalità Docente";
      }
      lucide.createIcons();
      renderApp();
    }

    async function handleCreateCategory(e) {
      e.preventDefault();
      if (!isTeacher) return;

      const title = document.getElementById("catTitle").value.trim();
      const desc = document.getElementById("catDesc").value.trim();
      const rawRes = document.getElementById("catResources").value.trim();

      if (!title) return;

      const newCat = {
        title: title,
        description: desc,
        resources: parseResourceInputs(rawRes),
        createdAt: new Date().toISOString()
      };

      const { collection, addDoc } = window.fbMethods;
      await addDoc(collection(window.db, "categories"), newCat);

      document.getElementById("catTitle").value = "";
      document.getElementById("catDesc").value = "";
      document.getElementById("catResources").value = "";
    }

    function parseResourceInputs(text) {
      if (!text) return [];
      const items = [];
      if (text.includes("<blockquote") || text.includes("<iframe")) {
        items.push({ type: "embed", content: text });
      } else {
        text.split(/\s+/).filter(u => u.startsWith("http")).forEach(url => {
          if (url.includes("youtube.com") || url.includes("youtu.be")) items.push({ type: "youtube", url });
          else items.push({ type: "link", url });
        });
      }
      return items;
    }

    async function handleWordSubmit(e, categoryId) {
      e.preventDefault();
      const input = document.getElementById(`wordInput_${categoryId}`);
      if (!input) return;

      const raw = input.value.trim().toLowerCase().replace(/[^\w\u00C0-\u024F]/gi, "");
      if (!raw) return;

      const { collection, addDoc } = window.fbMethods;
      await addDoc(collection(window.db, "words"), {
        categoryId: categoryId,
        word: raw,
        createdAt: new Date().toISOString()
      });

      input.value = "";
    }

    function renderApp() {
      const container = document.getElementById("categoriesContainer");
      const emptyState = document.getElementById("emptyState");

      if (categories.length === 0) {
        emptyState.classList.remove("hidden");
        container.innerHTML = "";
        return;
      }

      emptyState.classList.add("hidden");
      container.innerHTML = "";

      categories.forEach((cat, index) => {
        const catCard = document.createElement("article");
        catCard.className = "bg-slate-800/60 border border-slate-700/80 rounded-3xl p-6 sm:p-8 space-y-8 shadow-2xl relative overflow-hidden backdrop-blur-md";
        
        catCard.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-700/60 pb-6">
            <div>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-2">Modulo #${index + 1}</span>
              <h2 class="text-2xl font-bold text-white">${escapeHtml(cat.title)}</h2>
              ${cat.description ? `<p class="text-sm text-slate-300 mt-1">${escapeHtml(cat.description)}</p>` : ""}
            </div>
            ${isTeacher ? `<button onclick="deleteCategory('${cat.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/30">Elimina Modulo</button>` : ""}
          </div>

          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="media" class="w-4 h-4 text-indigo-400"></i> Sezione 1: Contenuti Social
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${renderResources(cat.resources)}
            </div>
          </div>

          <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-5 sm:p-6 space-y-4">
            <h3 class="text-sm font-bold text-white">Sezione 2: La tua descrizione (Anonimo)</h3>
            <form onsubmit="handleWordSubmit(event, '${cat.id}')" class="flex flex-col sm:flex-row gap-3">
              <input type="text" id="wordInput_${cat.id}" required placeholder="Scrivi una parola..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
              <button type="submit" class="px-6 py-3 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-500 text-white transition">Invia Parola</button>
            </form>
          </div>

          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sezione 3: Muro delle Parole della Classe</h3>
              <span id="wordCountBadge_${cat.id}" class="text-xs text-slate-400 font-medium">0 parole</span>
            </div>
            <div id="wordCloud_${cat.id}" class="min-h-[140px] bg-slate-900/40 border border-slate-800 rounded-2xl p-6 flex flex-wrap items-center justify-center gap-3"></div>
          </div>
        `;

        container.appendChild(catCard);
        renderCategoryWords(cat.id);
      });

      lucide.createIcons();
      if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
    }

    function renderResources(resources) {
      if (!resources || resources.length === 0) return `<p class="text-xs text-slate-500 italic">Nessun contenuto multimediale allegato.</p>`;
      return resources.map(res => {
        if (res.type === "embed") return `<div class="overflow-hidden rounded-xl border border-slate-700 bg-slate-900 p-2 flex justify-center">${res.content}</div>`;
        if (res.type === "youtube") {
          const videoId = res.url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/)?.[1] || "";
          return `<div class="aspect-video rounded-xl overflow-hidden border border-slate-700 bg-slate-900"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
        }
        return `<div class="bg-slate-900 border border-slate-700 rounded-xl p-4 flex justify-between items-center"><span class="text-xs text-slate-300 truncate">${escapeHtml(res.url)}</span><a href="${escapeHtml(res.url)}" target="_blank" class="text-xs text-indigo-400 font-bold">Apri</a></div>`;
      }).join("");
    }

    function renderCategoryWords(categoryId) {
      const cloud = document.getElementById(`wordCloud_${categoryId}`);
      const countBadge = document.getElementById(`wordCountBadge_${categoryId}`);
      if (!cloud) return;

      const wordsForCat = wordEntries.filter(w => w.categoryId === categoryId);
      if (countBadge) countBadge.textContent = `${wordsForCat.length} risposte totali`;

      if (wordsForCat.length === 0) {
        cloud.innerHTML = `<p class="text-xs text-slate-500 italic">In attesa dei contributi degli studenti...</p>`;
        return;
      }

      const freqMap = {};
      wordsForCat.forEach(w => {
        const word = w.word.toUpperCase();
        freqMap[word] = (freqMap[word] || 0) + 1;
      });

      cloud.innerHTML = Object.entries(freqMap).map(([word, count]) => {
        const sizeClass = count > 5 ? "text-2xl font-black text-amber-400" : count > 3 ? "text-xl font-bold text-indigo-300" : count > 1 ? "text-base font-semibold text-purple-300" : "text-sm font-medium text-slate-300";
        return `<span class="animate-float inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 ${sizeClass}">${escapeHtml(word)}${count > 1 ? `<span class="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded-full">${count}</span>` : ""}</span>`;
      }).join("");
    }

    async function deleteCategory(categoryId) {
      if (!isTeacher || !confirm("Eliminare questa categoria?")) return;
      const { doc, deleteDoc } = window.fbMethods;
      await deleteDoc(doc(window.db, "categories", categoryId));
    }

    async function confirmResetAll() {
      if (!isTeacher || !confirm("Cancellare TUTTO il database?")) return;
      const { collection, getDocs, deleteDoc, doc } = window.fbMethods;
      const cats = await getDocs(collection(window.db, "categories"));
      cats.forEach(async d => await deleteDoc(doc(window.db, "categories", d.id)));
      const words = await getDocs(collection(window.db, "words"));
      words.forEach(async d => await deleteDoc(doc(window.db, "words", d.id)));
    }

    function exportWordsCSV() {
      if (wordEntries.length === 0) return alert("Nessun dato presente.");
      let csv = "data:text/csv;charset=utf-8,Categoria,Parola,Data\n";
      wordEntries.forEach(w => {
        const cat = categories.find(c => c.id === w.categoryId);
        csv += `"${cat ? cat.title : "Generica"}","${w.word}","${w.createdAt}"\n`;
      });
      const a = document.createElement("a");
      a.href = encodeURI(csv);
      a.download = `report_parole_${Date.now()}.csv`;
      a.click();
    }

    function escapeHtml(str) { return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
  </script>
