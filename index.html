<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attività Didattica Interattiva - Social & Word Wall</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }
    .animate-float { animation: floatBubble 4s ease-in-out infinite; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>

  <!-- Firebase SDK (v10) per Sincronizzazione Real-Time -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // =========================================================================
    // ⚠️ SOSTITUISCI QUESTA SEZIONE CON I TUOI DATI DI FIREBASE
    // =========================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBoZnEHxc_bBRdP84fJJyrfTd8r3jYjL6E",
  authDomain: "autogestione-10-26.firebaseapp.com",
  projectId: "autogestione-10-26",
  storageBucket: "autogestione-10-26.firebasestorage.app",
  messagingSenderId: "348550005255",
  appId: "1:348550005255:web:c25572e28337633bdb20a2",
  measurementId: "G-LQYHDLHBHQ"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.fbMethods = { collection, onSnapshot, addDoc, deleteDoc, doc, getDocs };
  </script>
</head>
<body class="min-h-full flex flex-col font-sans bg-slate-900 text-slate-100">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/20">
          <i data-lucide="sparkles" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white">Social Analysis & Word Cloud</h1>
          <p class="text-xs text-slate-400 hidden sm:block">Laboratorio Interattivo Real-Time</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Live Cloud
        </span>
      </div>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

    <!-- PANNELLO DOCENTE (LIBERO / ACCESSIBILE A TUTTI) -->
    <section class="bg-slate-800/80 border border-indigo-500/30 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-700/60">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg border border-indigo-500/20">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-white">Pannello Gestione Docente</h2>
            <p class="text-xs text-slate-400">Crea moduli di analisi, scarica i dati o azzera le risposte</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="exportWordsCSV()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition flex items-center gap-1.5">
            <i data-lucide="download" class="w-4 h-4"></i> Esporta CSV
          </button>
          <button onclick="confirmResetAll()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/10 text-rose-300 border border-rose-500/30 hover:bg-rose-500/20 transition flex items-center gap-1.5">
            <i data-lucide="trash-2" class="w-4 h-4"></i> Resetta Tutto
          </button>
        </div>
      </div>

      <form onsubmit="handleCreateCategory(event)" class="space-y-4">
        <h3 class="text-sm font-semibold text-slate-200">Aggiungi Nuova Categoria / Modulo</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="catTitle" required placeholder="Titolo Categoria *" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          <input type="text" id="catDesc" placeholder="Descrizione o domande per gli studenti" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <textarea id="catResources" rows="2" placeholder="Incolla qui l'embed di Instagram/TikTok o link YouTube/Web..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
        <button type="submit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> Crea Categoria
        </button>
      </form>
    </section>

    <!-- STATO VUOTO -->
    <div id="emptyState" class="text-center py-16 bg-slate-800/40 border border-dashed border-slate-700 rounded-2xl p-8">
      <i data-lucide="layout-grid" class="w-10 h-10 text-slate-500 mx-auto mb-3"></i>
      <h3 class="text-lg font-bold text-slate-300 mb-1">In Attesa di Moduli</h3>
      <p class="text-sm text-slate-400">Crea il primo modulo dal pannello in alto per iniziare l'attività.</p>
    </div>

    <!-- CATEGORIE E PAROLE -->
    <div id="categoriesContainer" class="space-y-16"></div>

  </main>

  <script>
    let categories = [];
    let wordEntries = [];

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initFirebaseListeners();
    });

    function initFirebaseListeners() {
      const checkFB = setInterval(() => {
        if (window.db && window.fbMethods) {
          clearInterval(checkFB);
          const { collection, onSnapshot } = window.fbMethods;

          // Ascolto Categorie Real-Time
          onSnapshot(collection(window.db, "categories"), (snapshot) => {
            categories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderApp();
          });

          // Ascolto Parole Real-Time
          onSnapshot(collection(window.db, "words"), (snapshot) => {
            wordEntries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            categories.forEach(c => renderCategoryWords(c.id));
          });
        }
      }, 100);
    }

    async function handleCreateCategory(e) {
      e.preventDefault();
      const title = document.getElementById("catTitle").value.trim();
      const desc = document.getElementById("catDesc").value.trim();
      const rawRes = document.getElementById("catResources").value.trim();

      if (!title) return;

      const newCat = {
        title: title,
        description: desc,
        resources: parseResourceInputs(rawRes),
        createdAt: new Date().toISOString()
      };

      const { collection, addDoc } = window.fbMethods;
      await addDoc(collection(window.db, "categories"), newCat);

      document.getElementById("catTitle").value = "";
      document.getElementById("catDesc").value = "";
      document.getElementById("catResources").value = "";
    }

    function parseResourceInputs(text) {
      if (!text) return [];
      const items = [];
      if (text.includes("<blockquote") || text.includes("<iframe")) {
        items.push({ type: "embed", content: text });
      } else {
        text.split(/\s+/).filter(u => u.startsWith("http")).forEach(url => {
          if (url.includes("youtube.com") || url.includes("youtu.be")) items.push({ type: "youtube", url });
          else items.push({ type: "link", url });
        });
      }
      return items;
    }

    async function handleWordSubmit(e, categoryId) {
      e.preventDefault();
      const input = document.getElementById(`wordInput_${categoryId}`);
      if (!input) return;

      const raw = input.value.trim().toLowerCase().replace(/[^\w\u00C0-\u024F]/gi, "");
      if (!raw) return;

      const { collection, addDoc } = window.fbMethods;
      await addDoc(collection(window.db, "words"), {
        categoryId: categoryId,
        word: raw,
        createdAt: new Date().toISOString()
      });

      input.value = "";
    }

    function renderApp() {
      const container = document.getElementById("categoriesContainer");
      const emptyState = document.getElementById("emptyState");

      if (categories.length === 0) {
        emptyState.classList.remove("hidden");
        container.innerHTML = "";
        return;
      }

      emptyState.classList.add("hidden");
      container.innerHTML = "";

      categories.forEach((cat, index) => {
        const catCard = document.createElement("article");
        catCard.className = "bg-slate-800/60 border border-slate-700/80 rounded-3xl p-6 sm:p-8 space-y-8 shadow-2xl relative overflow-hidden backdrop-blur-md";
        
        catCard.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-700/60 pb-6">
            <div>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-2">Modulo #${index + 1}</span>
              <h2 class="text-2xl font-bold text-white">${escapeHtml(cat.title)}</h2>
              ${cat.description ? `<p class="text-sm text-slate-300 mt-1">${escapeHtml(cat.description)}</p>` : ""}
            </div>
            <button onclick="deleteCategory('${cat.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 transition flex items-center gap-1">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Elimina Modulo
            </button>
          </div>

          <!-- SEZIONE 1: POST / MEDIA -->
          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="media" class="w-4 h-4 text-indigo-400"></i> Sezione 1: Contenuti Social
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${renderResources(cat.resources)}
            </div>
          </div>

          <!-- SEZIONE 2: INPUT STUDENTE -->
          <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-5 sm:p-6 space-y-4">
            <h3 class="text-sm font-bold text-white">Sezione 2: La tua descrizione (Anonimo)</h3>
            <form onsubmit="handleWordSubmit(event, '${cat.id}')" class="flex flex-col sm:flex-row gap-3">
              <input type="text" id="wordInput_${cat.id}" required placeholder="Scrivi una parola..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
              <button type="submit" class="px-6 py-3 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-4 h-4"></i> Invia Parola
              </button>
            </form>
          </div>

          <!-- SEZIONE 3: MURO CLOUD -->
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sezione 3: Muro delle Parole della Classe</h3>
              <span id="wordCountBadge_${cat.id}" class="text-xs text-slate-400 font-medium">0 parole</span>
            </div>
            <div id="wordCloud_${cat.id}" class="min-h-[140px] bg-slate-900/40 border border-slate-800 rounded-2xl p-6 flex flex-wrap items-center justify-center gap-3"></div>
          </div>
        `;

        container.appendChild(catCard);
        renderCategoryWords(cat.id);
      });

      lucide.createIcons();
      if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
    }

    function renderResources(resources) {
      if (!resources || resources.length === 0) return `<p class="text-xs text-slate-500 italic">Nessun contenuto multimediale allegato.</p>`;
      return resources.map(res => {
        if (res.type === "embed") return `<div class="overflow-hidden rounded-xl border border-slate-700 bg-slate-900 p-2 flex justify-center">${res.content}</div>`;
        if (res.type === "youtube") {
          const videoId = res.url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/)?.[1] || "";
          return `<div class="aspect-video rounded-xl overflow-hidden border border-slate-700 bg-slate-900"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
        }
        return `<div class="bg-slate-900 border border-slate-700 rounded-xl p-4 flex justify-between items-center"><span class="text-xs text-slate-300 truncate">${escapeHtml(res.url)}</span><a href="${escapeHtml(res.url)}" target="_blank" class="text-xs text-indigo-400 font-bold">Apri</a></div>`;
      }).join("");
    }

    function renderCategoryWords(categoryId) {
      const cloud = document.getElementById(`wordCloud_${categoryId}`);
      const countBadge = document.getElementById(`wordCountBadge_${categoryId}`);
      if (!cloud) return;

      const wordsForCat = wordEntries.filter(w => w.categoryId === categoryId);
      if (countBadge) countBadge.textContent = `${wordsForCat.length} risposte totali`;

      if (wordsForCat.length === 0) {
        cloud.innerHTML = `<p class="text-xs text-slate-500 italic">In attesa dei contributi degli studenti...</p>`;
        return;
      }

      const freqMap = {};
      wordsForCat.forEach(w => {
        const word = w.word.toUpperCase();
        freqMap[word] = (freqMap[word] || 0) + 1;
      });

      cloud.innerHTML = Object.entries(freqMap).map(([word, count]) => {
        const sizeClass = count > 5 ? "text-2xl font-black text-amber-400" : count > 3 ? "text-xl font-bold text-indigo-300" : count > 1 ? "text-base font-semibold text-purple-300" : "text-sm font-medium text-slate-300";
        return `<span class="animate-float inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 ${sizeClass}">${escapeHtml(word)}${count > 1 ? `<span class="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded-full">${count}</span>` : ""}</span>`;
      }).join("");
    }

    async function deleteCategory(categoryId) {
      if (!confirm("Eliminare questa categoria?")) return;
      const { doc, deleteDoc } = window.fbMethods;
      await deleteDoc(doc(window.db, "categories", categoryId));
    }

    async function confirmResetAll() {
      if (!confirm("Cancellare TUTTO il database?")) return;
      const { collection, getDocs, deleteDoc, doc } = window.fbMethods;
      const cats = await getDocs(collection(window.db, "categories"));
      cats.forEach(async d => await deleteDoc(doc(window.db, "categories", d.id)));
      const words = await getDocs(collection(window.db, "words"));
      words.forEach(async d => await deleteDoc(doc(window.db, "words", d.id)));
    }

    function exportWordsCSV() {
      if (wordEntries.length === 0) return alert("Nessun dato presente.");
      let csv = "data:text/csv;charset=utf-8,Categoria,Parola,Data\n";
      wordEntries.forEach(w => {
        const cat = categories.find(c => c.id === w.categoryId);
        csv += `"${cat ? cat.title : "Generica"}","${w.word}","${w.createdAt}"\n`;
      });
      const a = document.createElement("a");
      a.href = encodeURI(csv);
      a.download = `report_parole_${Date.now()}.csv`;
      a.click();
    }

    function escapeHtml(str) { return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
  </script>
  <script async src="//www.instagram.com/embed.js"></script>
</body>
</html>
